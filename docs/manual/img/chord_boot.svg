<text class="t" x="810" y="585">F8</text>
<text class="lb" x="710" y="632">DISK</text>
<text class="lb" x="810" y="632">TEST</text>
</svg>
<rect x="16" y="468" width="30" height="30" rx="5" fill="#7a7a7a" stroke="#ffb000" stroke-width="5"/>
