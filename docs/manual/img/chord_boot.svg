<svg xmlns="http://www.w3.org/2000/svg" width="840" height="510" viewBox="0 0 840 510" role="img" aria-labelledby="t d">
<title id="t">Panel: Shift, F1, F7 (DISK) and F8 (TEST) are ringed. Hold Shift and F1 with F7 or F8 while you turn the unit on.</title>
<desc id="d">At power-up: hold Shift and F1 with F7 until the strip shows USB DISK, or with F8 for the INPUT TEST screen.</desc>
<style>
.body { fill: #3c3c3c; }
.screen { fill: #141414; stroke: #262626; stroke-width: 2; }
.soft { fill: #8a8a8a; }
.pad { fill: #6a6a6a; }
.key { fill: #7a7a7a; }
.btn { fill: #5e5e5e; }
.t { font-family: sans-serif; font-size: 12px; fill: #f4f4f4; text-anchor: middle; }
.tk { font-family: sans-serif; font-size: 10px; fill: #f4f4f4; text-anchor: middle; }
.dk { fill: #141414; }
.cap { font-family: sans-serif; font-size: 13px; fill: #b0b0b0; }
.scr { font-family: sans-serif; font-size: 16px; fill: #6f6f6f; text-anchor: middle; }
.p{fill:#ffb000}
.h{stroke:#ffb000;stroke-width:7}
.lb{font-family:sans-serif;font-size:20px;font-weight:bold;fill:#ffb000;text-anchor:middle}
.lk{font-family:sans-serif;font-size:14px;font-weight:bold;fill:#141414;text-anchor:middle}
.bn{font-family:sans-serif;font-size:16px;font-weight:bold;fill:#f4f4f4;text-anchor:middle}
.cp{font-family:sans-serif;font-size:30px;fill:#f4f4f4;text-anchor:middle}
.lg{font-family:sans-serif;font-size:20px;fill:#f4f4f4}
</style>
<rect class="body" width="840" height="510" rx="14"/>
<svg x="0" y="0" width="232" height="232" viewBox="900 330 232 232">
<rect class="key" x="900" y="330" width="72" height="72" rx="6"/>
<text class="t" x="936" y="376">Play</text>
<rect class="key" x="980" y="330" width="72" height="72" rx="6"/>
<text class="tk" x="1016" y="345">Paste</text>
<text class="t" x="1016" y="376">Copy</text>
<rect class="key" x="1060" y="330" width="72" height="72" rx="6"/>
<text class="tk" x="1096" y="345">Home</text>
<text class="t" x="1096" y="376">Insert</text>
<rect x="900" y="410" width="72" height="72" rx="6" fill="#d32f2f"/>
<text class="t" x="936" y="456">Rec</text>
<rect class="key h" x="980" y="410" width="72" height="72" rx="6"/>
<text class="t" x="1016" y="456">Shift</text>
<rect class="key" x="1060" y="410" width="72" height="72" rx="6"/>
<text class="t" x="1096" y="456">Left</text>
</svg>
<svg x="0" y="248" width="840" height="208" viewBox="40 476 840 208">
<rect class="screen" x="60" y="60" width="800" height="480" rx="10"/>
<rect class="soft h" x="66" y="556" width="88" height="48" rx="6"/>
<text class="t" x="110" y="585">F1</text>
<rect class="soft" x="166" y="556" width="88" height="48" rx="6"/>
