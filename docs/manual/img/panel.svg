<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="960" viewBox="0 0 1360 960" role="img" aria-labelledby="t d">
  <title id="t">Panel of the unit, schematic</title>
  <desc id="d">Schematic of the unit: the screen top left, eight soft keys F1 to F8 under it, a 12 by 4 pad grid, a 5 by 3 block of screen buttons top right, a 5 by 2 block of edit and transport keys below it, and one large encoder bottom right. Not to scale.</desc>
  <style>
    .body { fill: #3c3c3c; }
    .screen { fill: #141414; stroke: #262626; stroke-width: 2; }
    .soft { fill: #8a8a8a; }
    .pad { fill: #6a6a6a; }
    .key { fill: #7a7a7a; }
    .btn { fill: #5e5e5e; }
    .t { font-family: sans-serif; font-size: 12px; fill: #f4f4f4; text-anchor: middle; }
    .tk { font-family: sans-serif; font-size: 10px; fill: #f4f4f4; text-anchor: middle; }
    .dk { fill: #141414; }
    .cap { font-family: sans-serif; font-size: 13px; fill: #b0b0b0; }
    .scr { font-family: sans-serif; font-size: 16px; fill: #6f6f6f; text-anchor: middle; }
  </style>

  <!-- unit body -->
  <rect class="body" x="20" y="20" width="1320" height="920" rx="28"/>

  <!-- screen, top left (800 x 480) -->
