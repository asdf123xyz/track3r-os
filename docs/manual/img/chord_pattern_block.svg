<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410" role="img" aria-labelledby="t d">
<title id="t">Panel: Shift is ringed and the four arrow keys are marked. Hold Shift, then press an arrow to select a block.</title>
<desc id="d">Pattern: hold Shift, then press an arrow to select a block. Keep both held to make it bigger.</desc>
<style>
.body { fill: #3c3c3c; }
.screen { fill: #141414; stroke: #262626; stroke-width: 2; }
.soft { fill: #8a8a8a; }
.pad { fill: #6a6a6a; }
.key { fill: #7a7a7a; }
.btn { fill: #5e5e5e; }
.t { font-family: sans-serif; font-size: 12px; fill: #f4f4f4; text-anchor: middle; }
.tk { font-family: sans-serif; font-size: 10px; fill: #f4f4f4; text-anchor: middle; }
.dk { fill: #141414; }
.cap { font-family: sans-serif; font-size: 13px; fill: #b0b0b0; }
.scr { font-family: sans-serif; font-size: 16px; fill: #6f6f6f; text-anchor: middle; }
.p{fill:#ffb000}
.h{stroke:#ffb000;stroke-width:7}
.lb{font-family:sans-serif;font-size:20px;font-weight:bold;fill:#ffb000;text-anchor:middle}
.lk{font-family:sans-serif;font-size:14px;font-weight:bold;fill:#141414;text-anchor:middle}
.bn{font-family:sans-serif;font-size:16px;font-weight:bold;fill:#f4f4f4;text-anchor:middle}
.cp{font-family:sans-serif;font-size:30px;fill:#f4f4f4;text-anchor:middle}
.lg{font-family:sans-serif;font-size:20px;fill:#f4f4f4}
</style>
<rect class="body" width="440" height="410" rx="14"/>
<svg x="0" y="0" width="440" height="312" viewBox="900 250 440 312">
<rect class="key" x="900" y="330" width="72" height="72" rx="6"/>
<text class="t" x="936" y="376">Play</text>
<rect class="key" x="980" y="330" width="72" height="72" rx="6"/>
<text class="tk" x="1016" y="345">Paste</text>
<text class="t" x="1016" y="376">Copy</text>
<rect class="key" x="1060" y="330" width="72" height="72" rx="6"/>
<text class="tk" x="1096" y="345">Home</text>
<text class="t" x="1096" y="376">Insert</text>
<rect class="key p" x="1140" y="330" width="72" height="72" rx="6"/>
<text class="t" x="1176" y="376" style="fill:#141414">Up</text>
<rect class="key" x="1220" y="330" width="72" height="72" rx="6"/>
<text class="tk" x="1256" y="345">Backspace</text>
<text class="t" x="1256" y="376">Delete</text>
<rect x="900" y="410" width="72" height="72" rx="6" fill="#d32f2f"/>
<text class="t" x="936" y="456">Rec</text>
<rect class="key h" x="980" y="410" width="72" height="72" rx="6"/>
<text class="t" x="1016" y="456">Shift</text>
<rect class="key p" x="1060" y="410" width="72" height="72" rx="6"/>
<text class="t" x="1096" y="456" style="fill:#141414">Left</text>
<rect class="key p" x="1140" y="410" width="72" height="72" rx="6"/>
<text class="t" x="1176" y="456" style="fill:#141414">Down</text>
<rect class="key p" x="1220" y="410" width="72" height="72" rx="6"/>
<text class="t" x="1256" y="456" style="fill:#141414">Right</text>
<text class="lk" x="1176" y="393">BLOCK</text>
<circle cx="1155" cy="345" r="14" fill="#141414"/><text class="bn" x="1155" y="351">2</text>
<circle cx="995" cy="425" r="14" fill="#141414"/><text class="bn" x="995" y="431">1</text>
<text class="lk" x="1096" y="473">BLOCK</text>
<circle cx="1075" cy="425" r="14" fill="#141414"/><text class="bn" x="1075" y="431">2</text>
<text class="lk" x="1176" y="473">BLOCK</text>
<circle cx="1155" cy="425" r="14" fill="#141414"/><text class="bn" x="1155" y="431">2</text>
<text class="lk" x="1256" y="473">BLOCK</text>
<circle cx="1235" cy="425" r="14" fill="#141414"/><text class="bn" x="1235" y="431">2</text>
</svg>
<rect x="16" y="324" width="30" height="30" rx="5" fill="#7a7a7a" stroke="#ffb000" stroke-width="5"/>
<text class="lg" x="60" y="346">1  hold down</text>
<rect x="16" y="368" width="30" height="30" rx="5" fill="#ffb000"/>
<text class="lg" x="60" y="390">2  press one of them</text>
</svg>
