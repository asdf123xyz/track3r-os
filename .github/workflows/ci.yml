# SPDX-License-Identifier: GPL-3.0-or-later
#
# Host build and tests only (ASan + UBSan, the simulator goldens, the layer check, the Python reference tools). The pinned Arm GNU
# toolchain (docs/toolchain.md) is unpacked because the host build packs the SD modules with it. The QEMU and MK66 cross builds
# are run with tools/ci.sh qemu / mk66 on a developer machine.
# Runs for a release tag (v*, alongside release.yml), for a pull request to dev or main (OS-PUBLIC: a change sent from outside gets the host gate
# before review), or by hand (maintainer, 2026-10-16: GitHub Actions minutes are limited); day-to-day the gate is tools/ci.sh run locally.
name: ci

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The manual's sync gate (tools/manual_check.py --gate) needs the history: it compares the change with the merge base with the target branch.
          fetch-depth: 0
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake g++ python3 ccache xz-utils curl libopenmpt0t64
      - name: Cache the Arm GNU toolchain archive
        uses: actions/cache@v4
        with:
          path: arm-archive
          key: ${{ runner.os }}-${{ hashFiles('tools/ci.sh') }}
      - name: Unpack the pinned Arm GNU toolchain
        # The host build packs the .tmod modules with arm-none-eabi-g++, and tests of the built-in modules need them.
        env:
          O3OS_CI_ARCHIVE_DIR: ${{ github.workspace }}/arm-archive
        run: tools/ci.sh toolchain
      - name: Host build and ctest
        env:
          O3OS_CI_NICE: "0"
          # A pull request: the manual gate compares with the branch it targets (origin/dev or origin/main). Empty on a tag or a manual run: the gate
          # then compares with dev, or only warns when there is no such history.
          O3OS_MANUAL_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: tools/ci.sh host
